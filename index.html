<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectuverso | Admin & Biblioteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        #pdf-render-container { background: #334155; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        canvas { box-shadow: 0 15px 35px rgba(0,0,0,0.4); max-width: 100%; height: auto !important; border-radius: 4px; background: white; }
        
        .nav-btn { transition: all 0.2s; border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 14px; }
        .nav-btn.active { background: #fbbf24 !important; color: #000 !important; }

        /* Botón admin oculto inicialmente (sin !important para permitir control por JS) */
        #btn-admin { display: none; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 id="logo-secret" onclick="secretClickTrigger()" class="text-xl font-black text-yellow-500 tracking-tighter cursor-default select-none transition-all duration-300">LECTUVERSO</h1>
            <div class="flex gap-2">
                <button onclick="switchView('user')" id="btn-user" class="nav-btn bg-slate-800 hover:bg-slate-700 active"> Biblioteca</button>
                <button onclick="switchView('admin')" id="btn-admin" class="nav-btn bg-slate-800 hover:bg-slate-700"> Admin</button>
            </div>
        </div>
    </nav>

    <div id="view-login" class="view p-6 max-w-md mx-auto mt-10">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
            <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">Acceso Administrativo 🔐</h2>
            <div class="space-y-4">
                <input type="text" id="login-user" placeholder="Usuario" class="w-full border p-3 rounded-xl outline-none focus:border-yellow-500">
                <input type="password" id="login-pass" placeholder="Contraseña" class="w-full border p-3 rounded-xl outline-none focus:border-yellow-500">
                <button onclick="checkCredentials()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition shadow-lg">Ingresar</button>
            </div>
        </div>
    </div>

    <div id="view-admin" class="view p-6 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold text-slate-800">Panel de Control</h2>
            <button onclick="logout()" class="text-sm text-red-500 font-bold hover:underline">Cerrar Sesión</button>
        </div>
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 space-y-4">
            <input type="text" id="book-title" placeholder="Título del Libro" class="w-full border p-3 rounded-xl">
            <select id="book-category" class="w-full border p-3 rounded-xl">
                <option value="">Categoría</option>
                <option>Amor</option><option>Misterio</option><option>Autoayuda</option><option>Tecnología</option>
            </select>
            <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-200">
                <label class="block text-xs font-bold text-yellow-700 mb-1 uppercase">Páginas Gratis:</label>
                <input type="number" id="book-limit" value="2" class="w-full border p-3 rounded-xl">
            </div>
            <input type="file" id="book-file" accept="application/pdf" class="w-full border p-3 rounded-xl">
            <button onclick="uploadBook()" class="w-full bg-emerald-500 text-white py-4 rounded-xl font-bold hover:bg-emerald-600 transition">Publicar Libro</button>
        </div>
    </div>

    <div id="view-user" class="view active p-6 max-w-6xl mx-auto">
        <h2 class="text-3xl font-bold mb-8 text-slate-800">Catálogo de Lectura</h2>
        <div id="library-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </div>

    <div id="reader-modal" class="fixed inset-0 bg-black/95 hidden z-[100] flex flex-col">
