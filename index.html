<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectuverso | Biblioteca Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        #pdf-render-container { background: #334155; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        canvas { box-shadow: 0 15px 35px rgba(0,0,0,0.4); max-width: 100%; height: auto !important; border-radius: 4px; background: white; }
    </style>
</head>
<body>

    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-yellow-500 tracking-tighter">LECTUVERSO</h1>
            <div id="admin-nav-zone">
                </div>
        </div>
    </nav>

    <main class="p-6 max-w-6xl mx-auto">
        <h2 class="text-3xl font-bold mb-8 text-slate-800">Catálogo de Lectura</h2>
        <div id="library-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>

    <div id="reader-modal" class="fixed inset-0 bg-black/95 hidden z-[100] flex flex-col">
        <div class="bg-slate-900 p-4 flex justify-between items-center text-white border-b border-white/10">
            <h3 id="reader-book-name" class="font-bold text-yellow-500"></h3>
            <button onclick="closeReader()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-bold transition">Cerrar ✕</button>
        </div>
        <div class="flex-grow overflow-y-auto" id="reader-scroll-container">
            <div id="pdf-render-container"></div>
            <div id="paywall" class="hidden bg-white text-slate-900 p-10 m-10 rounded-3xl max-w-lg mx-auto text-center shadow-2xl relative">
                <h2 class="text-2xl font-black mb-2 uppercase">📖 Muestra Finalizada</h2>
                <p class="mb-6 text-slate-500">Adquiere la versión completa para terminar esta historia.</p>
                <button class="w-full bg-emerald-500 text-white py-4 rounded-xl font-bold uppercase hover:bg-emerald-600 transition shadow-lg">💳 Pagar y Desbloquear</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        let library = JSON.parse(localStorage.getItem('lectuverso_db')) || [];

        // DETECCIÓN DE MODO ADMIN (La magia está aquí)
        function checkAdminSession() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auth') === 'admin_active') {
                document.getElementById('admin-nav-zone').innerHTML = `
                    <a href="admin-lectuverso.html" class="bg-yellow-500 text-black text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-tighter hover:bg-yellow-400">Regresar al Panel Admin</a>
                `;
            } else {
                document.getElementById('admin-nav-zone').innerHTML = `
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Lector Premium</span>
                `;
            }
        }

        function renderLibrary() {
            const grid = document.getElementById('library-grid');
            grid.innerHTML = library.length ? "" : "<p class='col-span-full text-center py-20 opacity-50'>Nuevos libros próximamente...</p>";
            library.forEach(book => {
                grid.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border hover:border-yellow-500 transition-all cursor-pointer group" onclick="openBook(${book.id})">
                        <div class="h-40 bg-slate-50 rounded-xl mb-4 flex items-center justify-center text-4xl group-hover:scale-105 transition-transform">📖</div>
                        <h4 class="font-bold text-slate-800 truncate">${book.title}</h4>
                        <p class="text-[10px] text-yellow-600 font-black uppercase tracking-wider">${book.category || 'General'}</p>
                    </div>`;
            });
        }

        async function openBook(id) {
            const book = library.find(b => b.id === id);
            if (!book) return;

            document.getElementById('reader-scroll-container').scrollTop = 0;
            document.getElementById('reader-book-name').innerText = book.title;
            document.getElementById('reader-modal').classList.remove('hidden');
            document.getElementById('paywall').classList.add('hidden');
            document.body.style.overflow = 'hidden';
            
            const container = document.getElementById('pdf-render-container');
            container.innerHTML = '<p class="text-white py-20 animate-pulse">Abriendo universo de lectura...</p>';

            try {
                const base64 = book.pdfBase64.split(',')[1];
                const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
                container.innerHTML = "";
                
                const limit = parseInt(book.limit) || 2;
                for (let n = 1; n <= pdf.numPages; n++) {
                    if (n > limit) {
                        document.getElementById('paywall').classList.remove('hidden');
                        break;
                    }
                    const page = await pdf.getPage(n);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    container.appendChild(canvas);
                }
            } catch (err) { alert("Error al cargar el PDF."); closeReader(); }
        }

        function closeReader() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onload = () => {
            renderLibrary();
            checkAdminSession();
        };
    </script>
</body>
</html>
