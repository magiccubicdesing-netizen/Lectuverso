<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectuverso | Biblioteca Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --gold: #fbbf24; --slate: #1e293b; }
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; }
        @media print { body { display: none; } }
        .no-select { user-select: none; -webkit-user-select: none; }
    </style>
</head>
<body class="no-select">

    <nav class="p-6 flex justify-between items-center border-b border-white/10 sticky top-0 bg-[#0f172a]/80 backdrop-blur-md z-40">
        <h1 class="text-2xl font-black text-yellow-500 tracking-tighter cursor-pointer" onclick="showSection('hero')">LECTUVERSO</h1>
        <div class="space-x-6 text-sm font-medium">
            <a href="#" onclick="showSection('hero')" class="hover:text-yellow-500 transition">Inicio</a>
            <a href="#" onclick="showSection('catalog')" class="hover:text-yellow-500 transition">Catálogo</a>
        </div>
    </nav>

    <section id="hero-section" class="py-20 px-6 text-center">
        <h2 class="text-6xl font-extrabold mb-6">Tu Puerta a la <span class="text-yellow-500">Sabiduría.</span></h2>
        <div class="flex justify-center gap-4">
            <button onclick="showSection('catalog')" class="bg-yellow-500 text-black px-10 py-4 rounded-full font-bold shadow-lg hover:scale-105 transition">Explorar Catálogo</button>
        </div>
    </section>

    <section id="catalog-section" class="hidden py-20 px-6 min-h-screen bg-slate-50 text-slate-900">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-4xl font-black mb-10 italic text-center">Nuestra <span class="text-yellow-500">Colección</span></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                
                <div class="bg-white p-6 rounded-3xl shadow-xl border-4 border-yellow-500 text-center">
                    <div class="bg-slate-900 w-full h-64 mb-4 rounded-lg flex flex-col items-center justify-center text-yellow-500 p-4">
                        <span class="text-xs font-bold uppercase tracking-widest mb-2 text-yellow-500">ACCESO LIBRE</span>
                        <h4 class="font-black text-xl leading-tight">TDA vs TDAH</h4>
                        <p class="text-[10px] mt-2 text-slate-400 italic">LECTURA ABIERTA</p>
                    </div>
                    <h3 class="font-bold text-xl">¿De qué hablamos?</h3>
                    <p class="text-slate-500 text-sm mb-4">Salud y Bienestar</p>
                    <button onclick="openFreeReader()" class="w-full bg-yellow-500 text-black py-3 rounded-xl font-black hover:bg-yellow-600 transition">LEER GRATIS AHORA</button>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-200 text-center opacity-50">
                    <div class="bg-slate-200 w-full h-64 mb-4 rounded-lg flex items-center justify-center text-slate-400 italic font-bold">PREMIUM</div>
                    <h3 class="font-bold text-xl">Amor Eterno</h3>
                    <button class="w-full bg-slate-300 text-slate-500 py-2 rounded-xl font-bold cursor-not-allowed">Solo Suscriptores</button>
                </div>
            </div>
        </div>
    </section>

    <div id="reader-modal" class="fixed inset-0 bg-[#0f172a] hidden z-[60] flex flex-col p-6">
        <div class="max-w-3xl mx-auto w-full flex-grow overflow-y-auto py-10">
            <h2 id="reader-book-title" class="text-3xl font-bold text-yellow-500 mb-6 border-b border-white/10 pb-4"></h2>
            <div id="reader-content" class="text-lg leading-relaxed text-slate-200 space-y-6"></div>
        </div>
        <div class="max-w-3xl mx-auto w-full py-6 flex justify-between border-t border-white/10">
            <button onclick="prevChapter()" class="text-slate-400 hover:text-white transition">← Anterior</button>
            <span id="chapter-label" class="font-bold text-yellow-500">Capítulo 1</span>
            <button onclick="nextChapter()" class="text-yellow-500 font-bold hover:text-white transition">Siguiente →</button>
        </div>
        <button onclick="closeReader()" class="absolute top-6 right-6 bg-white/10 p-2 rounded-full hover:bg-red-500 transition">✕</button>
    </div>

    <script>
        let currentChapter = 0;
        const libroFree = {
            titulo: "TDA vs TDAH: ¿De qué estamos hablando?",
            capitulos: [
                "INTRODUCCIÓN: No soy médico, no soy psicólogo, no soy neurólogo. Soy una persona curiosa -como vos- que alguna vez se preguntó por qué era tan difícil concentrarse...",
                "CAPÍTULO 1: EL MOTOR QUE NO SE APAGA. Imagina que tu mente es un motor que nunca se apaga, ni siquiera de noche. No es solo falta de atención, es una forma distinta de procesar el mundo.",
                "CAPÍTULO 2: MITOS Y REALIDADES. A menudo escuchamos que el TDA es 'falta de límites' o 'pereza'. Nada más lejos de la realidad. Aquí exploraremos las bases biológicas.",
                "PÁGINA FINAL: Este es el final de la muestra gratuita del Tomo I."
            ]
        };

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
        }

        // FUNCIÓN CLAVE: Abre directamente sin mirar LocalStorage ni Planes
        function openFreeReader() {
            currentChapter = 0;
            updateReader();
            document.getElementById('reader-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function updateReader() {
            document.getElementById('reader-book-title').innerText = libroFree.titulo;
            document.getElementById('reader-content').innerHTML = `<p>${libroFree.capitulos[currentChapter]}</p>`;
            document.getElementById('chapter-label').innerText = `Capítulo ${currentChapter + 1}`;
        }

        function closeReader() { 
            document.getElementById('reader-modal').classList.add('hidden'); 
            document.body.style.overflow = 'auto';
        }

        function nextChapter() { 
            if(currentChapter < libroFree.capitulos.length - 1) { 
                currentChapter++; 
                updateReader(); 
            } 
        }

        function prevChapter() { 
            if(currentChapter > 0) { 
                currentChapter--; 
                updateReader(); 
            } 
        }

        // Limpieza automática de cualquier bloqueo anterior al cargar la página
        window.onload = () => { localStorage.removeItem('plan'); };
    </script>
</body>
</html>
