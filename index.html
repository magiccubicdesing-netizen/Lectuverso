<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectuverso | Acceso Privado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .view-hidden { display: none !important; }
        #pdf-render-container { background: #1e293b; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        canvas { box-shadow: 0 15px 35px rgba(0,0,0,0.6); max-width: 100%; height: auto !important; border-radius: 4px; background: white; }
    </style>
</head>
<body>

    <div id="login-screen" class="fixed inset-0 z-[200] bg-slate-900 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black text-yellow-500 tracking-tighter mb-2">LECTUVERSO</h1>
                <p class="text-slate-400 text-sm">Ingresa tus credenciales para acceder</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Usuario</label>
                    <input type="text" id="user-input" class="w-full bg-slate-900 border-none p-4 rounded-2xl outline-none focus:ring-2 ring-yellow-500 text-white transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Contraseña</label>
                    <input type="password" id="pass-input" class="w-full bg-slate-900 border-none p-4 rounded-2xl outline-none focus:ring-2 ring-yellow-500 text-white transition">
                </div>
                <button onclick="handleLogin()" class="w-full bg-yellow-500 text-slate-900 font-black py-4 rounded-2xl hover:bg-yellow-400 transition shadow-lg uppercase tracking-widest mt-4">Entrar al Universo</button>
            </div>
        </div>
    </div>

    <div id="main-content" class="view-hidden min-h-screen bg-slate-50 text-slate-900">
        <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <h1 class="text-xl font-black text-yellow-500 tracking-tighter">LECTUVERSO</h1>
                <div id="admin-nav-zone" class="flex gap-4">
                    </div>
            </div>
        </nav>

        <main class="p-6 max-w-6xl mx-auto">
            <h2 class="text-3xl font-bold mb-8 text-slate-800">Catálogo de Lectura</h2>
            <div id="library-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </main>
    </div>

    <div id="reader-modal" class="fixed inset-0 bg-black/95 hidden z-[100] flex flex-col">
        <div class="bg-slate-900 p-4 flex justify-between items-center text-white border-b border-white/10">
            <h3 id="reader-book-name" class="font-bold text-yellow-500"></h3>
            <button onclick="closeReader()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-bold transition">Cerrar ✕</button>
        </div>
        <div class="flex-grow overflow-y-auto" id="reader-scroll-container">
            <div id="pdf-render-container"></div>
            <div id="paywall" class="hidden bg-white text-slate-900 p-10 m-10 rounded-3xl max-w-lg mx-auto text-center shadow-2xl relative">
                <h2 class="text-2xl font-black mb-2 uppercase">📖 Muestra Finalizada</h2>
                <p class="mb-6 text-slate-500">Adquiere la versión completa para terminar esta historia.</p>
                <button class="w-full bg-emerald-500 text-white py-4 rounded-xl font-bold uppercase hover:bg-emerald-600 transition shadow-lg">💳 Pagar y Desbloquear</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        let library = JSON.parse(localStorage.getItem('lectuverso_db')) || [];
        
        // --- SISTEMA DE ACCESO ---
        function handleLogin() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;

            // CASO 1: ADMINISTRADOR
            if (u === "Lectuverso2026" && p === "Lectuverso2026") {
                showLibrary(true);
            } 
            // CASO 2: USUARIO ESTÁNDAR (Puedes cambiar "invitado" por lo que quieras)
            else if (u === "usuario" && p === "lectura2026") {
                showLibrary(false);
            } 
            else {
                alert("Acceso denegado. Verifica tus credenciales.");
            }
        }

        function showLibrary(isAdmin) {
            document.getElementById('login-screen').classList.add('view-hidden');
            document.getElementById('main-content').classList.remove('view-hidden');
            
            const navZone = document.getElementById('admin-nav-zone');
            if (isAdmin) {
                navZone.innerHTML = `
                    <a href="admin-lectuverso.html" class="bg-yellow-500 text-black text-[10px] font-black px-4 py-2 rounded-full uppercase hover:bg-yellow-400">Panel de Control Admin</a>
                    <button onclick="location.reload()" class="text-xs text-slate-400 hover:text-white transition font-bold">Salir</button>
                `;
            } else {
                navZone.innerHTML = `
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest pt-2">Lector Premium</span>
                    <button onclick="location.reload()" class="text-xs text-slate-400 hover:text-white transition font-bold">Salir</button>
                `;
            }
            renderLibrary();
        }

        // --- FUNCIONES DE LIBRERÍA (Sin alteraciones) ---
        function renderLibrary() {
            const grid = document.getElementById('library-grid');
            grid.innerHTML = library.length ? "" : "<p class='col-span-full text-center py-20 opacity-50'>Nuevos libros próximamente...</p>";
            library.forEach(book => {
                grid.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border hover:border-yellow-500 transition-all cursor-pointer group" onclick="openBook(${book.id})">
                        <div class="h-40 bg-slate-50 rounded-xl mb-4 flex items-center justify-center text-4xl group-hover:scale-105 transition-transform">📖</div>
                        <h4 class="font-bold text-slate-800 truncate">${book.title}</h4>
                        <p class="text-[10px] text-yellow-600 font-black uppercase tracking-wider">${book.category || 'General'}</p>
                    </div>`;
            });
        }

        async function openBook(id) {
            const book = library.find(b => b.id === id);
            if (!book) return;
            document.getElementById('reader-scroll-container').scrollTop = 0;
            document.getElementById('reader-book-name').innerText = book.title;
            document.getElementById('reader-modal').classList.remove('hidden');
            document.getElementById('paywall').classList.add('hidden');
            document.body.style.overflow = 'hidden';
            const container = document.getElementById('pdf-render-container');
            container.innerHTML = '<p class="text-white py-20 animate-pulse">Abriendo universo de lectura...</p>';
            try {
                const base64 = book.pdfBase64.split(',')[1];
                const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
                container.innerHTML = "";
                const limit = parseInt(book.limit) || 2;
                for (let n = 1; n <= pdf.numPages; n++) {
                    if (n > limit) { document.getElementById('paywall').classList.remove('hidden'); break; }
                    const page = await pdf.getPage(n);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    container.appendChild(canvas);
                }
            } catch (err) { alert("Error al cargar el PDF."); closeReader(); }
        }

        function closeReader() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
