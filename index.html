<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectuverso - Biblioteca Digital Protegida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-slate: #334155;
            --accent-gold: #fbbf24;
            --accent-white: #ffffff;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--accent-white);
            font-family: 'Inter', sans-serif;
        }
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 10;
            font-weight: bold;
        }
        .reader-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: var(--bg-slate);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .text-gold-400 { color: #fbbf24; }
        .bg-gold-500 { background-color: #fbbf24; }
    </style>
</head>
<body class="min-h-screen">

    <header class="bg-slate-900 py-4 shadow-md">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gold-400">Lectuverso</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="#hero" class="text-white hover:text-gold-400 transition">Inicio</a></li>
                    <li><a href="#catalog" class="text-white hover:text-gold-400 transition">Catálogo</a></li>
                    <li><a href="#plans" class="text-white hover:text-gold-400 transition">Planes</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="hero" class="py-20 bg-gradient-to-r from-slate-900 to-slate-800 border-b border-slate-700 text-center">
        <div class="container mx-auto px-4">
            <h2 class="text-5xl font-bold mb-4 text-gold-400">Bienvenido a Lectuverso</h2>
            <p class="text-xl mb-8 text-slate-300">Lectura protegida y exclusiva.</p>
            <a href="#catalog" class="bg-gold-500 text-slate-900 px-8 py-3 rounded-lg font-bold hover:bg-gold-400 transition">Explorar Catálogo</a>
        </div>
    </section>

    <section id="plans" class="py-16 bg-slate-900/50">
        <div class="container mx-auto px-4 text-center">
            <h3 class="text-3xl font-bold mb-8 text-gold-400">Planes de Suscripción</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="bg-slate-800 p-8 rounded-xl border border-slate-700">
                    <h4 class="text-2xl font-bold mb-4 text-gold-400">Básico</h4>
                    <p class="text-3xl font-bold mb-6">$15.000 <span class="text-sm font-normal text-slate-400">/mes</span></p>
                    <button onclick="openPayment('basico')" class="w-full bg-gold-500 text-slate-900 font-bold py-2 rounded hover:bg-gold-400 transition">Pagar ahora</button>
                </div>
                </div>
        </div>
    </section>

    <div id="payment-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white p-8 rounded-xl max-w-md w-full shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center border-b pb-4">Pago Seguro - Lectuverso</h2>
            <form id="payment-form">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2 text-left">Selecciona tu método de pago:</label>
                    <select id="bank-select" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-gold-500 text-gray-700" required>
                        <option value="">-- Elegir banco o billetera --</option>
                        <option value="Nequi">Nequi</option>
                        <option value="Daviplata">Daviplata</option>
                        <option value="Bancolombia">Bancolombia (Ahorros)</option>
                        <option value="PSE">PSE / Otros Bancos</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2 text-left">Número de cuenta o celular:</label>
                    <input type="text" id="account-number" placeholder="Ej: 310 123 4567" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-gold-500 text-gray-700" required>
                </div>
                <button type="submit" class="w-full bg-gold-500 text-slate-900 font-bold py-3 rounded hover:bg-gold-400 transition shadow-md">Confirmar y Activar</button>
            </form>
            <button onclick="closePayment()" class="mt-4 text-gray-400 hover:text-gray-600 w-full text-center text-sm transition">Cancelar y volver</button>
        </div>
    </div>

    <div id="reader" class="fixed inset-0 bg-black/95 flex items-center justify-center hidden z-50 p-4">
        <div class="reader-container relative overflow-hidden">
            <div class="watermark">PROPIEDAD DE LECTUVERSO</div>
            <div id="book-content" class="reader-text text-slate-200"></div>
            <button onclick="closeReader()" class="mt-8 bg-gold-500 text-slate-900 px-6 py-2 rounded font-bold">Cerrar</button>
        </div>
    </div>

    <script>
        // Seguridad: Bloqueo básico
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Modal de Pago
        function openPayment(plan) {
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closePayment() {
            document.getElementById('payment-modal').classList.add('hidden');
        }

        document.getElementById('payment-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const bank = document.getElementById('bank-select').value;
            const account = document.getElementById('account-number').value;
            
            alert(`¡Solicitud recibida! Para completar el pago vía ${bank}, por favor envía el comprobante al soporte. Tu cuenta se activará en breve.`);
            localStorage.setItem('subscription', 'basico');
            closePayment();
        });

        // Lector
        function closeReader() {
            document.getElementById('reader').classList.add('hidden');
        }
    </script>
</body>
</html>
